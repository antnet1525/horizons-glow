<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidden Violets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, #1a3a1a 0%, #2d5a2d 50%, #1a3a1a 100%);
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', serif;
            position: relative;
        }

        /* Progress bar */
        .progress-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 30px;
            border-radius: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .progress-container.visible {
            opacity: 1;
        }

        .progress-text {
            color: #4a0e4e;
            font-size: 1.1em;
            margin-bottom: 8px;
            text-align: center;
            font-weight: bold;
        }

        .progress-bar {
            width: 250px;
            height: 12px;
            background: rgba(138, 43, 226, 0.2);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8a2be2, #9b59b6);
            width: 0%;
            transition: width 0.5s ease;
        }

        /* Forest scene */
        .forest {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Tree trunks */
        .tree {
            position: absolute;
            width: 80px;
            background: linear-gradient(90deg, #2d1810 0%, #3d2817 50%, #2d1810 100%);
            box-shadow: inset -8px 0 15px rgba(0, 0, 0, 0.5), inset 8px 0 15px rgba(0, 0, 0, 0.3);
            z-index: 5;
        }

        /* Grass and bushes */
        .vegetation {
            position: absolute;
            cursor: pointer;
        }

        .vegetation .grass,
        .vegetation .bush,
        .vegetation .bush::before,
        .vegetation .bush::after {
            transition: filter 0.2s ease;
        }

        .vegetation:hover .grass,
        .vegetation:hover .bush::before,
        .vegetation:hover .bush::after {
            filter: brightness(1.3);
        }

        .grass {
            width: 40px;
            height: 80px;
            background: linear-gradient(180deg, #4a6a4a 0%, #3a5a3a 50%, #2d4a2d 100%);
            clip-path: polygon(50% 0%, 60% 20%, 70% 10%, 80% 30%, 90% 20%, 100% 100%, 0% 100%, 10% 20%, 20% 30%, 30% 10%, 40% 20%);
        }

        .tall-grass {
            width: 30px;
            height: 120px;
            background: linear-gradient(180deg, #5a7a5a 0%, #4a6a4a 50%, #3a5a3a 100%);
            clip-path: polygon(50% 0%, 55% 15%, 65% 10%, 70% 25%, 80% 20%, 85% 35%, 90% 30%, 100% 100%, 0% 100%, 10% 30%, 15% 35%, 20% 20%, 30% 25%, 35% 10%, 45% 15%);
            display: none;
        }

        .bush {
            width: 100px;
            height: 90px;
            position: relative;
        }

        .bush::before {
            content: '';
            position: absolute;
            width: 80px;
            height: 75px;
            background: radial-gradient(ellipse at 40% 40%, #4a6a4a 0%, #3a5a3a 60%, #2d4a2d 100%);
            border-radius: 50% 50% 48% 48%;
            bottom: 0;
            left: 10px;
            box-shadow: inset -5px -5px 10px rgba(0, 0, 0, 0.3);
        }

        .bush::after {
            content: '';
            position: absolute;
            width: 65px;
            height: 60px;
            background: radial-gradient(ellipse at 45% 45%, #5a7a5a 0%, #4a6a4a 70%, #3a5a3a 100%);
            border-radius: 50%;
            top: 0;
            left: 20px;
            box-shadow: inset -3px -3px 8px rgba(0, 0, 0, 0.2);
        }

        /* Violet flower */
        .violet {
            position: absolute;
            width: 30px;
            height: 30px;
            opacity: 0;
            transition: opacity 0.5s ease, filter 0.2s ease;
            pointer-events: none;
            z-index: 100;
        }

        .violet.revealed {
            opacity: 1;
            animation: glow 2s ease-in-out infinite;
            pointer-events: all;
            cursor: pointer;
        }

        .violet.revealed:hover {
            filter: brightness(1.4);
        }

        .violet.revealed:hover ~ .grass,
        .violet.revealed:hover ~ .bush::before,
        .violet.revealed:hover ~ .bush::after,
        .violet.revealed:hover ~ .large-bush::before,
        .violet.revealed:hover ~ .large-bush::after {
            filter: brightness(1) !important;
        }

        .petal {
            position: absolute;
            width: 12px;
            height: 16px;
            background: radial-gradient(ellipse at 50% 60%, #8a2be2 0%, #6a1bb2 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            left: 50%;
            top: 50%;
            transform-origin: center center;
        }

        .petal:nth-child(1) { transform: translate(-50%, -50%) rotate(0deg) translateY(-8px); }
        .petal:nth-child(2) { transform: translate(-50%, -50%) rotate(72deg) translateY(-8px); }
        .petal:nth-child(3) { transform: translate(-50%, -50%) rotate(144deg) translateY(-8px); }
        .petal:nth-child(4) { transform: translate(-50%, -50%) rotate(216deg) translateY(-8px); }
        .petal:nth-child(5) { transform: translate(-50%, -50%) rotate(288deg) translateY(-8px); }

        .violet-center {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffd700;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 8px #8a2be2); }
            50% { filter: drop-shadow(0 0 15px #9b59b6); }
        }

        /* Message popup */
        .message-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 90%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.98);
            border: 3px solid rgba(138, 43, 226, 0.5);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            z-index: 200;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .message-popup.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: all;
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 199;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .popup-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .close-button {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 30px;
            height: 30px;
            background: rgba(138, 43, 226, 0.2);
            border: 2px solid rgba(138, 43, 226, 0.5);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            color: #4a0e4e;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .close-button:hover {
            background: rgba(138, 43, 226, 0.4);
            transform: rotate(90deg);
        }

        .popup-title {
            color: #4a0e4e;
            font-size: 1.5em;
            margin-bottom: 20px;
            text-align: center;
        }

        .popup-text {
            color: #5D4037;
            font-size: 1.1em;
            line-height: 1.8;
        }

        /* Back button */
        .back-button {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(138, 43, 226, 0.4);
            border-radius: 8px;
            color: #4a0e4e;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Georgia', serif;
            font-weight: bold;
            z-index: 100;
        }

        .back-button:hover {
            background: rgba(138, 43, 226, 0.2);
            border-color: rgba(138, 43, 226, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <audio id="backgroundMusic" loop>
        <source src="violet.mp3" type="audio/mpeg">
    </audio>

    <button class="back-button" onclick="window.location.href='index.html'">← Back to Tree</button>

    <div class="progress-container" id="progressContainer">
        <div class="progress-text">Find all the Violets! (<span id="foundCount">0</span>/5)</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="forest" id="forest"></div>

    <div class="popup-overlay" id="popupOverlay"></div>
    <div class="message-popup" id="messagePopup">
        <div class="close-button" id="closeButton">×</div>
        <h2 class="popup-title">Violet</h2>
        <div class="popup-text" id="popupText"></div>
    </div>

    <script>
        const messages = [
            "Dear Zianie, \nViolet! Pretty much your favorite color hehe",
            "Did you know that in the Victorian language of flowers (aka floriography), violets symbolize modesty, faithfulness, and loyalty? The violet/purple color is like love and devotion!",
            "Part of this is because violets tend to grow pretty low and have kind of a \"shy\" habit, hence the phrase \"shrinking violet.\"",
            "I think finding these hidden violets are like us having these hidden \"quiet\" moments in our relationship that only we know. A sort of modest, loyal, devoted love that is present and powerful even if not outspoken!",
            "Hope you liked this minigame! \nLove, \nHeeminie"
        ];

        let foundViolets = 0;
        const totalViolets = 5;

        // Play background music
        const music = document.getElementById('backgroundMusic');
        music.volume = 0.4;
        music.play().catch(e => {
            document.body.addEventListener('click', () => {
                music.play();
            }, { once: true });
        });

        // Tree positions (left%, bottom in vh where trunk bottom appears)
        const trees = [
            { left: 8, bottom: 15 },
            { left: 28, bottom: 25 },
            { left: 50, bottom: 20 },
            { left: 72, bottom: 30 },
            { left: 88, bottom: 18 }
        ];

        // Vegetation positions (left%, bottom%, z-index, type, hasViolet, violetOffset for x and y)
        const vegetationData = [
            { left: 5, bottom: 10, z: 15, type: 'bush', hasViolet: true, violetX: 45, violetY: 40 },
            { left: 11, bottom: 12, z: 16, type: 'grass', hasViolet: false },
            { left: 49, bottom: 15, z: 18, type: 'grass', hasViolet: false },
            { left: 30, bottom: 20, z: 20, type: 'bush', hasViolet: true, violetX: 55, violetY: 35 },
            { left: 26, bottom: 15, z: 21, type: 'bush', hasViolet: false },
            { left: 52, bottom: 13, z: 22, type: 'grass', hasViolet: false },
            { left: 76, bottom: 25, z: 19, type: 'grass', hasViolet: true, violetX: 35, violetY: 30 },
            { left: 90, bottom: 16, z: 25, type: 'bush', hasViolet: false },
            { left: 45, bottom: 30, z: 24, type: 'grass', hasViolet: false },
            { left: 18, bottom: 47, z: 19, type: 'bush', hasViolet: true, violetX: 63, violetY: 50 },
            { left: 82, bottom: 35, z: 26, type: 'grass', hasViolet: false },
            { left: 20, bottom: 45, z: 28, type: 'grass', hasViolet: false },
            { left: 38, bottom: 50, z: 30, type: 'bush', hasViolet: true, violetX: 10, violetY: 45 },
            { left: 70, bottom: 29, z: 29, type: 'grass', hasViolet: false },
            { left: 18, bottom: 46, z: 20, type: 'grass', hasViolet: false },
            { left: 44, bottom: 28, z: 31, type: 'grass', hasViolet: false },
            { left: 78, bottom: 68, z: 33, type: 'bush', hasViolet: false},
            { left: 41, bottom: 46, z: 40, type: 'grass', hasViolet: false },
            { left: 42, bottom: 47, z: 36, type: 'bush', hasViolet: false },
            { left: 82, bottom: 65, z: 34, type: 'grass', hasViolet: false }
        ];

        function createForest() {
            const forest = document.getElementById('forest');
            
            // Create tree trunks
            trees.forEach(tree => {
                const treeEl = document.createElement('div');
                treeEl.className = 'tree';
                treeEl.style.left = tree.left + '%';
                treeEl.style.bottom = tree.bottom + 'vh';
                treeEl.style.height = (100 + tree.bottom) + 'vh';
                forest.appendChild(treeEl);
            });

            // Create vegetation
            vegetationData.forEach((vegData, index) => {
                const veg = document.createElement('div');
                veg.className = 'vegetation';
                
                const vegElement = document.createElement('div');
                vegElement.className = vegData.type;
                veg.appendChild(vegElement);
                
                if (vegData.hasViolet) {
                    const violet = document.createElement('div');
                    violet.className = 'violet';
                    
                    // Position violet with offset
                    violet.style.left = vegData.violetX + '%';
                    violet.style.top = vegData.violetY + '%';
                    
                    for (let j = 0; j < 5; j++) {
                        const petal = document.createElement('div');
                        petal.className = 'petal';
                        violet.appendChild(petal);
                    }
                    
                    const center = document.createElement('div');
                    center.className = 'violet-center';
                    violet.appendChild(center);
                    
                    veg.appendChild(violet);
                    veg.dataset.hasViolet = 'true';
                    
                    // Add click handler to violet
                    violet.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (veg.dataset.messageIndex !== undefined) {
                            showMessage(parseInt(veg.dataset.messageIndex));
                        }
                    });
                    
                    // Prevent vegetation hover when hovering violet
                    violet.addEventListener('mouseenter', () => {
                        veg.style.pointerEvents = 'none';
                        violet.style.pointerEvents = 'all';
                    });
                    
                    violet.addEventListener('mouseleave', () => {
                        veg.style.pointerEvents = 'all';
                    });
                }
                
                veg.style.left = vegData.left + '%';
                veg.style.bottom = vegData.bottom + '%';
                veg.style.zIndex = vegData.z;
                
                veg.addEventListener('click', () => handleVegetationClick(veg));
                
                forest.appendChild(veg);
            });
        }

        function handleVegetationClick(veg) {
            if (veg.dataset.hasViolet === 'true' && !veg.dataset.found) {
                veg.dataset.found = 'true';
                const violet = veg.querySelector('.violet');
                violet.classList.add('revealed');
                
                // Assign message index
                veg.dataset.messageIndex = foundViolets;
                
                foundViolets++;
                updateProgress();
                
                if (foundViolets === 1) {
                    document.getElementById('progressContainer').classList.add('visible');
                }
            }
        }

        function showMessage(index) {
            const popup = document.getElementById('messagePopup');
            const overlay = document.getElementById('popupOverlay');
            const popupText = document.getElementById('popupText');
            
            popupText.textContent = messages[index];
            
            overlay.classList.add('visible');
            popup.classList.add('visible');
        }

        function hideMessage() {
            const popup = document.getElementById('messagePopup');
            const overlay = document.getElementById('popupOverlay');
            
            overlay.classList.remove('visible');
            popup.classList.remove('visible');
        }

        function updateProgress() {
            document.getElementById('foundCount').textContent = foundViolets;
            document.getElementById('progressFill').style.width = (foundViolets / totalViolets * 100) + '%';
        }

        // Close button handlers
        document.getElementById('closeButton').addEventListener('click', hideMessage);
        document.getElementById('popupOverlay').addEventListener('click', hideMessage);

        createForest();
    </script>
</body>
</html>
